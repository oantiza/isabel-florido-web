            required: true
          - name: formationTitle
            label: Título de formación
            type: string
            required: true
          - name: formationDescription
            label: Formación y práctica
            type: text
            required: true
          - name: formationNote
            label: Nota sobre aprendizaje
            type: text
            required: true
          - name: methodName
            label: Nombre de la propuesta
            type: string
            required: true
          - name: methodCta
            label: Acción del método
            type: string
            required: true
          - name: modalitiesTitle
            label: Título de modalidades
            type: string
            required: true
          - name: modalityNote
            label: Condiciones por confirmar
            type: text
            required: true
          - name: processLabel
            label: Etiqueta del recorrido
            type: string
            required: true
          - name: processTitle
            label: Título del recorrido
            type: text
            required: true
          - name: processDescription
            label: Introducción del recorrido
            type: text
            required: true
          - name: faqTitle
            label: Título de preguntas frecuentes
            type: string
            required: true
          - name: contactName
            label: Etiqueta de nombre
            type: string
            required: true
          - name: contactEmail
            label: Etiqueta de correo
            type: string
            required: true
          - name: contactMessage
            label: Etiqueta de mensaje
            type: string
            required: true
          - name: contactPlaceholder
            label: Ayuda del mensaje
            type: text
            required: true
          - name: contactButton
            label: Botón de envío de maqueta
            type: string
            required: true
          - name: mockLegend
            label: Título de maqueta
            type: string
            required: true
          - name: mockStatus
            label: Estado del formulario
            type: string
            required: true
          - name: realContactCta
            label: Acción de contacto por correo
            type: string
            required: true
          - name: phoneCta
