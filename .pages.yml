        required: true
      - name: aboutBiography
        label: Biografía
        type: text
        required: true
      - name: aboutNote
        label: Frase de Isabel
        type: text
        required: true
      - name: methodTitle
        label: Título del método
        type: text
        required: true
      - name: methodDescription
        label: Explicación del método
        type: text
        required: true
      - name: methodSummary
        label: Capacidades que se trabajan
        type: text
        required: true
      - name: practiceCaption
        label: Texto sobre fotografía de práctica
        type: text
        required: true
      - name: sessionsTitle
        label: Título de sesiones
        type: text
        required: true
      - name: sessionsDescription
        label: Presentación de las sesiones
        type: text
        required: true
      - name: sessionLanguagesTitle
        label: Título de idiomas
        type: string
        required: true
      - name: sessionLanguagesDescription
        label: Idiomas de las sesiones
        type: text
        required: true
      - name: sessionApproachTitle
        label: Título de adaptación
