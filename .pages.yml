# Edición de contenidos. No conecta ni publica el sitio automáticamente.
media:
  input: public/images
  output: /images
  categories:
    - image
content:
  - name: home-es
    label: Portada en español
    type: file
    path: src/data/home.es.json
    format: json
    fields:
      - name: heroIntro
        label: Introducción de portada
        type: string
        required: true
      - name: heroTitle
        label: Titular principal
        type: text
        required: true
