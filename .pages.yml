        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Título
            type: string
            required: true
          - name: text
            label: Texto
            type: text
            required: true
          - name: detail
            label: Nota de modalidad
            type: string
            required: true
      - name: steps
