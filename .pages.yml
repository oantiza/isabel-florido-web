        label: Nota al pie de portada
        type: text
        required: false
      - name: portraitCaption
        label: Pie de retrato
        type: string
        required: true
      - name: aboutTitle
        label: Título de trayectoria
        type: text
        required: true
      - name: aboutIntroduction
        label: Presentación de Isabel
